[package]
name = "cohort-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cohort desktop app: client UI plus the owner agent module"
rust-version = "1.77.2"

[lib]
name = "cohort_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
cohort-agent = { path = "../../crates/cohort-agent" }
serde = { workspace = true }
serde_json = { workspace = true }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
