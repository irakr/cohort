[package]
name = "cohort-llm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Provider-neutral LLM transport: OpenAI-compatible and Anthropic Messages"

[dependencies]
log = "0.4"
reqwest = { version = "0.13", features = ["json", "rustls", "http2"], default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ts-rs = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[features]
# Enables the ts-rs export tests used by `make types`. Off by default so a
# plain `cargo test` never writes TypeScript files.
ts-export = []
