[workspace]
resolver = "2"
members = ["crates/cohort-dirs", "crates/cohort-hub", "crates/cohort-agent", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
ts-rs = { version = "12", features = ["chrono-impl", "serde-json-impl"] }
